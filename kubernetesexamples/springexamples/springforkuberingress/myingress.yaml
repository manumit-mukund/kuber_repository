apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: myspringforkuberingressimingress
  annotations:
      kubernetes.i0/ingress.class: nginx
      nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
    - host: myspringforkuberingressim.com
      http:
        paths:
          - path: /v1
            pathType: Prefix
            backend:
              service:
                name: springforkuberingressimdeployment1
                port:
                  number: 8081
          - path: /v2
            pathType: Prefix
            backend:
              service:
                name: springforkuberingressimdeployment2
                port:
                  number: 8082