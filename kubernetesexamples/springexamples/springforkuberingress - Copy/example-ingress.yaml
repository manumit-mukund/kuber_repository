apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: example-ingress  
spec:
  ingressClassName: nginx
  rules:
    - host: hello-world.example
      http:
        paths:
          - path: /v1
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 8081
          - path: /v2
            pathType: Prefix
            backend:
              service:
                name: web2
                port:
                  number: 8081